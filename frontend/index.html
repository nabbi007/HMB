<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/HMB%20favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HelloMama</title>
    <script>
      // Applies the stored/system theme before first paint, so the page never
      // flashes light-then-dark (or vice versa) while React boots.
      (function () {
        try {
          var stored = localStorage.getItem("flowbite-theme-mode");
          var mode = stored === "light" || stored === "dark" || stored === "auto" ? stored : "auto";
          var dark = mode === "dark" || (mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
