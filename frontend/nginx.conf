server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow file uploads (backend caps at 5 MB; give headroom).
    client_max_body_size 10m;

    # Same-origin API: proxy the backend so the browser never makes a
    # cross-origin call (no CORS). `api` is the compose service name.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files served by the backend's StaticFiles mount.
    location /uploads/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Hashed build assets never change — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: every unknown path serves index.html so React Router
    # can handle client-side routes (e.g. /dashboard, /verification).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
